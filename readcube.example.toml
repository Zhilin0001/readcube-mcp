[readcube]
timeout = 30
retries = 2
min_interval = 0.25
dry_run = true
write_collections = []
upload_hosts = ["sync.readcube.com", "s3.amazonaws.com"]
upload_roots = []
# Session and ledger use ~/.config/readcube-client/ by default.

# Original downloads: private SHA-256-verified cache, no upload permissions needed.
download_hosts = ["sync.readcube.com", "*.amazonaws.com", "*.cloudfront.net"]
max_pdf_bytes = 104857600
# artifact_base_url is set automatically by the optional cloud entry point.
