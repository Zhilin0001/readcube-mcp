[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "readcube-agent-client"
version = "0.2.1"
description = "Evidence-gated unofficial ReadCube Papers SDK and MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3"]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
realtime = ["websockets>=15,<17"]
dev = ["pytest>=8,<10", "ruff>=0.9", "build>=1.2"]

[project.scripts]
readcube = "readcube_client.cli:main"
readcube-mcp = "readcube_mcp.server:main"

[tool.setuptools.packages.find]
include = ["readcube_client*", "readcube_mcp*"]

[tool.setuptools.package-data]
readcube_client = ["endpoints.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: explicitly enabled live read-only API tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
